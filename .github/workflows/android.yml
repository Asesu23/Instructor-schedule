name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VITE_API_URL: ${{ vars.APP_URL }}
  VITE_APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
  VITE_UPDATE_REPO: ${{ github.repository }}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: cd dist && zip -qr ../dist.zip .
      - run: npx cap add android
      - run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
      - run: cp -r resources/android/res/. android/app/src/main/res/
      - run: npx cap sync android
      - run: |
          mkdir -p ~/.android
          cp resources/android/debug.keystore ~/.android/debug.keystore
      - run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk instructor-schedule.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: instructor-schedule.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            instructor-schedule.apk
            dist.zip
          generate_release_notes: true
